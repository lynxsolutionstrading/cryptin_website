<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Shadow for contrast on light backgrounds -->
  <g fill="none" stroke="#000" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" opacity="0.55">
    <path d="M 3 30 L 12 3 L 20 11 Z"/>
    <path d="M 14 7 L 20 1 L 28 7 L 22 13 Z"/>
  </g>
  <!-- Blade -->
  <path d="M 3 30 L 12 3 L 20 11 Z"
        fill="#c49a18" stroke="#3a2002" stroke-width="0.7" stroke-linejoin="round"/>
  <!-- Blade bright face -->
  <path d="M 3 30 L 12 3 L 13 10 Z"
        fill="#edd84a" stroke="none"/>
  <!-- Crossguard body -->
  <path d="M 14 7 L 20 1 L 28 7 L 22 13 Z"
        fill="#7a3c10" stroke="#2a1000" stroke-width="0.7" stroke-linejoin="round"/>
  <!-- Crossguard inner lines -->
  <line x1="14" y1="7"  x2="28" y2="7"  stroke="#3a1800" stroke-width="1" stroke-linecap="round"/>
  <line x1="20" y1="1"  x2="22" y2="13" stroke="#3a1800" stroke-width="1" stroke-linecap="round"/>
  <!-- Blade edge highlight -->
  <path d="M 3 30 L 12 3" stroke="rgba(255,230,120,0.45)" stroke-width="0.9" stroke-linecap="round"/>
  <!-- Tip dot -->
  <circle cx="3" cy="30" r="1.2" fill="#edd84a"/>
</svg>
